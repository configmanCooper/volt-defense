<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0e17">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Volt Defense</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="css/style.css?v=20260512">
</head>
<body>
    <!-- Main Menu Screen -->
    <div id="menu-screen">
        <h1 class="game-title">⚡ Volt Defense</h1>
        <p class="game-subtitle">Build. Power. Defend.</p>

        <div id="difficulty-select">
            <h2>Select Difficulty</h2>
            <div class="difficulty-grid">
                <button class="difficulty-btn" data-action="select-difficulty" data-difficulty="watt">
                    <span class="diff-icon">💡</span>
                    <span class="diff-name">Watt</span>
                    <span class="diff-label">Easy</span>
                    <span class="diff-desc">Relaxed play. Weaker enemies, cheaper buildings.</span>
                </button>
                <button class="difficulty-btn diff-recommended selected" data-action="select-difficulty" data-difficulty="volt">
                    <span class="diff-icon">🔌</span>
                    <span class="diff-name">Volt</span>
                    <span class="diff-label">Medium — Recommended</span>
                    <span class="diff-desc">The intended experience. Balanced challenge.</span>
                </button>
                <button class="difficulty-btn" data-action="select-difficulty" data-difficulty="amp">
                    <span class="diff-icon">⚡</span>
                    <span class="diff-name">Amp</span>
                    <span class="diff-label">Hard</span>
                    <span class="diff-desc">Tougher enemies, pricier buildings, faster waves.</span>
                </button>
                <button class="difficulty-btn" data-action="select-difficulty" data-difficulty="lightning">
                    <span class="diff-icon">🌩️</span>
                    <span class="diff-name">Lightning</span>
                    <span class="diff-label">Very Hard</span>
                    <span class="diff-desc">Relentless. Waves every 60 seconds. Good luck.</span>
                </button>
            </div>
        </div>

        <div id="menu-music-controls">
            <button id="menu-music-toggle" class="menu-btn music-btn">🔊 Music On</button>
            <input type="range" id="menu-music-volume" class="music-slider" min="0" max="100" value="50">
        </div>

        <div id="menu-buttons">
            <button class="menu-btn" data-action="newGame">New Game</button>
            <button class="menu-btn" data-action="show-load-menu" id="btn-load-game">Load Game</button>
        </div>
        <div id="tutorial-toggle-area" style="margin-top:10px;text-align:center;">
            <label style="color:#aabbcc;font-size:14px;cursor:pointer;">
                <input type="checkbox" id="menu-tutorial-toggle" checked style="margin-right:6px;cursor:pointer;">
                Show Tutorial on New Game
            </label>
        </div>
        <div id="load-game-panel" style="display: none;">
            <h2>Load Game</h2>
            <div id="save-slot-list"></div>
            <button class="menu-btn" data-action="hide-load-menu" style="margin-top:12px;">Back</button>
        </div>
    </div>

    <!-- Game Screen (hidden until game starts) -->
    <div id="game-screen" style="display: none;">
        <!-- HUD Top Bar -->
        <div id="hud-bar">
            <div class="hud-group">
                <span class="hud-label">Wave</span>
                <span id="hud-wave" class="hud-value">0</span>
                <span id="hud-wave-timer" class="hud-timer">2:00</span>
            </div>
            <div class="hud-group">
                <span class="hud-label">$</span>
                <span id="hud-money" class="hud-value">2000</span>
            </div>
            <div class="hud-group hud-resources">
                <span title="Iron"><svg width="16" height="14" viewBox="0 0 16 14" style="vertical-align:middle;margin-right:2px;"><polygon points="3,8 5,2 13,2 15,8" fill="#b0b0b8"/><polygon points="3,8 15,8 15,12 3,12" fill="#8a8a92"/><polygon points="15,8 13,2 13,6 15,12" fill="#707078"/><polygon points="5,3 7,3 8,7 6,7" fill="rgba(255,255,255,0.2)"/></svg><span id="hud-iron">0</span></span>
                <span title="Coal"><svg width="16" height="14" viewBox="0 0 16 14" style="vertical-align:middle;margin-right:2px;"><circle cx="6" cy="9" r="3.5" fill="#2a2a2a"/><circle cx="10" cy="8" r="3" fill="#3a3a3a"/><circle cx="8" cy="5" r="2.8" fill="#2a2a2a"/><circle cx="4" cy="6" r="2" fill="#3a3a3a"/><circle cx="12" cy="5" r="2" fill="#2a2a2a"/><circle cx="8" cy="10" r="2.5" fill="#333"/></svg><span id="hud-coal">0</span></span>
                <span title="Uranium"><svg width="18" height="18" viewBox="0 0 16 16" style="vertical-align:middle;margin-right:2px;"><circle cx="8" cy="8" r="7.5" fill="#ffcc00"/><path d="M8,8 L8,1 A7,7 0 0,1 14,11.5 Z" fill="#222"/><path d="M8,8 L14,11.5 A7,7 0 0,1 2,11.5 Z" fill="#222"/><path d="M8,8 L2,11.5 A7,7 0 0,1 8,1 Z" fill="#222"/><circle cx="8" cy="8" r="1.8" fill="#222"/></svg><span id="hud-uranium">0</span></span>
                <span title="Oil"><svg width="16" height="18" viewBox="0 0 14 16" style="vertical-align:middle;margin-right:2px;"><path d="M7,1 C4,6 2,9 2,11.5 A5,5 0 0,0 12,11.5 C12,9 10,6 7,1Z" fill="#4a4a4a" stroke="#999" stroke-width="0.8"/><ellipse cx="5.5" cy="10" rx="1.2" ry="2" fill="rgba(255,255,255,0.25)" transform="rotate(-15 5.5 10)"/></svg><span id="hud-oil">0</span></span>
                <span title="Steel">🔩<span id="hud-steel">0</span></span>
            </div>
            <div class="hud-group">
                <span class="hud-label">👷</span>
                <span id="hud-workers" class="hud-value">0/0</span>
            </div>
            <div class="hud-group">
                <span class="hud-label">⚡</span>
                <span id="hud-energy" class="hud-value">0/0</span>
            </div>
            <div class="hud-group" style="position:relative">
                <span class="hud-label">💨</span>
                <span id="hud-pollution" class="hud-value pollution-clean" title="Pollution level&#10;&#10;Clean (0-49): No effects&#10;Low (50-149): No effects&#10;Moderate (150-299): 50% worker recruit chance, enemies +10% speed&#10;High (300-499): No recruitment, workers leave, enemies +20% speed&#10;Critical (500+): Workers leave faster, enemies +20% speed, -20% energy output">0</span>
            </div>
            <div class="hud-group">
                <span class="hud-label">Core</span>
                <span id="hud-core-hp" class="hud-value">100%</span>
            </div>
            <div class="hud-group">
                <span id="hud-daynight" class="hud-value" title="Day/Night cycle">☀️ Day</span>
            </div>
            <div class="hud-group">
                <span id="hud-wind" class="hud-value" title="Wind Speed">🌬️ 15mph</span>
            </div>
            <div class="hud-group hud-right">
                <button class="hud-btn" id="btn-music-toggle" title="Toggle Music [M]">🔊</button>
                <input type="range" id="hud-music-volume" class="hud-music-slider" min="0" max="100" value="50" title="Music Volume">
                <button class="hud-btn" id="btn-priorities" title="Energy Priorities" data-action="show-priorities">⚡</button>
                <button class="hud-btn" id="btn-energy-overlay" title="Toggle Energy Flow Overlay [E]" data-action="toggle-energy-overlay">🔌</button>
                <button class="hud-btn hud-speed-btn" id="btn-speed-down" title="Slow Down [-]">⏪</button>
                <span class="hud-speed-label" id="speed-label" title="Game Speed">1x</span>
                <button class="hud-btn hud-speed-btn" id="btn-speed-up" title="Speed Up [+]">⏩</button>
                <button class="hud-btn" data-action="pause" id="btn-pause" title="Pause [P]">⏸</button>
                <button class="hud-btn" id="btn-glossary" title="Enemy Glossary" data-action="show-glossary">📖</button>
                <button class="hud-btn" id="btn-weapons-glossary" title="Weapons Glossary" data-action="show-weapons-glossary">⚔️</button>
                <button class="hud-btn" id="btn-shortcuts" title="Keyboard Shortcuts" data-action="show-shortcuts">❓</button>
            </div>
        </div>

        <!-- Game Canvas -->
        <canvas id="game-canvas"></canvas>

        <!-- Mobile placement buttons (cancel + cycle cable target) -->
        <button id="btn-mobile-cancel" class="mobile-cancel-btn" title="Cancel" style="display:none;">✕</button>
        <button id="btn-mobile-cycle" class="mobile-cycle-btn" title="Cycle cable target" style="display:none;">🔄</button>

        <!-- Building Info Panel (right side, hidden by default) -->
        <div id="info-panel" style="display: none;"></div>

        <!-- Build Info Card (shown when selecting a build option) -->
        <div id="build-info-card"></div>

        <!-- Build Menu (bottom) -->
        <div id="build-bar">
            <button id="build-bar-toggle" class="build-bar-toggle" onclick="var bar=document.getElementById('build-bar');bar.classList.toggle('collapsed');this.textContent=bar.classList.contains('collapsed')?'▲ Build':'▼ Build';">▼ Build</button>
            <div id="build-categories">
                <button class="cat-btn" data-action="select-category" data-category="power" title="Power Plants [1]">⚡<span class="cat-label">Power</span></button>
                <button class="cat-btn" data-action="select-category" data-category="storage" title="Energy Storage [2]">🔋<span class="cat-label">Storage</span></button>
                <button class="cat-btn" data-action="select-category" data-category="mining" title="Mining [3]">⛏️<span class="cat-label">Mine</span></button>
                <button class="cat-btn" data-action="select-category" data-category="weapons" title="Weapons [4]">🔫<span class="cat-label">Weapons</span></button>
                <button class="cat-btn" data-action="select-category" data-category="defense" title="Defense [5]">🛡️<span class="cat-label">Defense</span></button>
                <button class="cat-btn" data-action="select-category" data-category="housing" title="Housing [6]">🏠<span class="cat-label">Housing</span></button>
                <button class="cat-btn" data-action="select-category" data-category="environment" title="Environment [7]">🌿<span class="cat-label">Environ</span></button>
                <button class="cat-btn" data-action="select-category" data-category="grid" title="Grid [8]">🔌<span class="cat-label">Grid</span></button>
                <button class="cat-btn" data-action="select-category" data-category="consumer" title="Consumer [9]">💲<span class="cat-label">Consumer</span></button>
            </div>
            <div id="build-submenu" style="display: none;"></div>
        </div>

        <!-- Mode Indicator (shows current input state) -->
        <div id="mode-indicator" style="display: none;"></div>

        <!-- Debug Bar (hidden until activated by typing "volt") -->
        <div id="debug-bar" style="display: none;">
            <div id="debug-header">
                <span>⚡ DEBUG</span>
                <div id="debug-toggles"></div>
            </div>
            <div id="debug-resources"></div>
            <div id="debug-categories"></div>
            <div id="debug-options"></div>
        </div>

        <!-- Toast Container -->
        <div id="toast-container"></div>

        <!-- Modal Overlay -->
        <div id="modal-overlay" style="display: none;">
            <div id="modal-box">
                <div id="modal-header">
                    <span id="modal-title"></span>
                    <button id="modal-close" data-action="close-modal">&times;</button>
                </div>
                <div id="modal-body"></div>
                <div id="modal-footer"></div>
            </div>
        </div>

        <!-- Pause Overlay -->
        <div id="pause-overlay" style="display: none;">
            <div class="pause-content">
                <h2>⏸ Paused</h2>
                <div class="pause-slot-info"><span id="pause-slot-num">Autosave</span></div>
                <button class="menu-btn" data-action="resume">Resume</button>
                <button class="menu-btn" data-action="save-game">Save Game</button>
                <button class="menu-btn" data-action="show-load-ingame">Load Game</button>
                <button class="menu-btn" data-action="quit-to-menu">Quit to Menu</button>
            </div>
            <div class="pause-load-panel" id="pause-save-panel" style="display: none;">
                <h3>Save Game</h3>
                <div id="pause-save-slot-list"></div>
                <button class="menu-btn" data-action="hide-save-ingame" style="margin-top:12px;">Back</button>
            </div>
            <div class="pause-load-panel" id="pause-load-panel" style="display: none;">
                <h3>Load Game</h3>
                <div id="pause-slot-list"></div>
                <button class="menu-btn" data-action="hide-load-ingame" style="margin-top:12px;">Back</button>
            </div>
        </div>
    </div>

    <!-- Scripts (order matters — dependencies first) -->
    <script src="js/config.js?v=20260512"></script>
    <script src="js/music.js?v=20260512"></script>
    <script src="js/engine.js?v=20260512"></script>
    <script src="js/map.js?v=20260512"></script>
    <script src="js/buildings.js?v=20260512"></script>
    <script src="js/energy.js?v=20260512"></script>
    <script src="js/workers.js?v=20260512"></script>
    <script src="js/economy.js?v=20260512"></script>
    <script src="js/enemies.js?v=20260512"></script>
    <script src="js/combat.js?v=20260512"></script>
    <script src="js/render.js?v=20260512"></script>
    <script src="js/ui.js?v=20260512"></script>
    <script src="js/input.js?v=20260512"></script>
    <script src="js/lz-string.min.js?v=20260512"></script>
    <script src="js/save.js?v=20260512"></script>
    <script src="js/tutorial.js?v=20260512"></script>
    <script src="js/main.js?v=20260512"></script>
</body>
</html>
